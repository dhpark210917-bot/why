<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ASP Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- Header Landmark (Deep Navy) -->
    <header class="site-header">
        <h1>ASP Student Portal</h1>
    </header>


    <!-- Main Container: Flexbox side-by-side card boxes -->
    <main class="dashboard-container">


        <!-- BOX 1: Course Registration Form Card -->
        <section class="card-box">
            <h2>Register for Course</h2>
            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="student-name"></label>
                    <input type="Student Name" id="student-name" name="fullname" required>
                </div>
                <div class="form-group">
                    <label for="">Email Address:</label>
                    <input type="student-email" id="student-email" name="email" required>
                </div>

                <button type="submit" class="submit-btn">Submit Registration</button>
            </form>
        </section>


        <!-- BOX 2: Class Schedule Table Card -->
        <section class="scheldule-table-card">
            <h2>Upcoming Schedule</h2>
            <br>
            <table class="scheldule-table">
            <thead>
            <tr><th>Course</th><th>Day</th><th>Room</th></tr>
            <tbody>
            <tr><td>Web Dev</td><td>Monday</td><td>Lab 101</td></tr>
            <tr><td>JS Core</td><td>Wednesday</td><td>Lab 102</td></tr>
            <tr><td colspan="3" class="break-cell">Midday Break</td></tr>
            </tbody>
            </thead>
            </table>
        </section>


    </main>


    <!-- Footer Landmark with External Blank Target Link -->
    <footer class="site-footer">
        <p> Visit our official site: <a href="https://www.asp.edu" target="_blank"> ASP Website</a></p>
    </footer>


</body>

</html>
